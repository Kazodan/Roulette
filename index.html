<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - Tirage au Sort</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        // Icône Gift
        const Gift = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
            </svg>
        );

        // Icône RotateCcw
        const RotateCcw = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
        );

        function LotteryWheel() {
            const [maxNumber, setMaxNumber] = useState('');
            const [phase, setPhase] = useState(0);
            const [winners, setWinners] = useState([]);
            const [isRolling, setIsRolling] = useState(false);
            const [displayNumbers, setDisplayNumbers] = useState([]);
            const [finalWinner, setFinalWinner] = useState(null);

            const getRandomNumber = (max, excludeList) => {
                let num;
                do {
                    num = Math.floor(Math.random() * max) + 1;
                } while (excludeList.includes(num));
                return num;
            };

            const animateRoll = (callback, duration = 2000) => {
                setIsRolling(true);
                const interval = setInterval(() => {
                    setDisplayNumbers(prev => {
                        const newNum = Math.floor(Math.random() * parseInt(maxNumber)) + 1;
                        return [...prev.slice(-9), newNum];
                    });
                }, 100);

                setTimeout(() => {
                    clearInterval(interval);
                    setIsRolling(false);
                    callback();
                }, duration);
            };

            const startPhase1 = () => {
                if (!maxNumber || parseInt(maxNumber) < 10) {
                    alert('الرجاء إدخال رقم أكبر من أو يساوي 10');
                    return;
                }
                
                setPhase(1);
                setDisplayNumbers([]);
                
                animateRoll(() => {
                    const selected = [];
                    while (selected.length < 10) {
                        const num = getRandomNumber(parseInt(maxNumber), selected);
                        selected.push(num);
                    }
                    setWinners(selected);
                    setDisplayNumbers(selected);
                });
            };

            const startPhase2 = () => {
                setPhase(2);
                setDisplayNumbers([]);
                
                animateRoll(() => {
                    const shuffled = [...winners].sort(() => Math.random() - 0.5);
                    const selected = shuffled.slice(0, 5);
                    setWinners(selected);
                    setDisplayNumbers(selected);
                });
            };

            const startPhase3 = () => {
                setPhase(3);
                setDisplayNumbers([]);
                
                animateRoll(() => {
                    const shuffled = [...winners].sort(() => Math.random() - 0.5);
                    const selected = shuffled.slice(0, 3);
                    setWinners(selected);
                    setDisplayNumbers(selected);
                });
            };

            const startPhase4 = () => {
                setPhase(4);
                setDisplayNumbers([]);
                
                animateRoll(() => {
                    const winner = winners[Math.floor(Math.random() * winners.length)];
                    setFinalWinner(winner);
                    setDisplayNumbers([winner]);
                }, 3000);
            };

            const reset = () => {
                setPhase(0);
                setWinners([]);
                setDisplayNumbers([]);
                setFinalWinner(null);
                setMaxNumber('');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400 p-8" dir="rtl">
                    <div className="max-w-4xl mx-auto">
                        <h1 className="text-5xl font-bold text-white text-center mb-8 drop-shadow-lg">
                            عجلة الحظ
                        </h1>

                        {phase === 0 && (
                            <div className="bg-white rounded-3xl shadow-2xl p-8 text-center">
                                <h2 className="text-3xl font-bold text-gray-800 mb-6">
                                    أدخل أكبر رقم للمشاركين
                                </h2>
                                <input
                                    type="number"
                                    value={maxNumber}
                                    onChange={(e) => setMaxNumber(e.target.value)}
                                    className="w-64 px-6 py-4 text-2xl text-center border-4 border-purple-400 rounded-xl mb-6 focus:outline-none focus:border-purple-600"
                                    placeholder="مثال: 100"
                                    min="10"
                                />
                                <button
                                    onClick={startPhase1}
                                    className="block mx-auto bg-gradient-to-r from-purple-600 to-pink-500 text-white px-12 py-4 rounded-xl text-2xl font-bold hover:scale-105 transition-transform shadow-lg"
                                >
                                    ابدأ المرحلة الأولى
                                </button>
                            </div>
                        )}

                        {phase >= 1 && phase < 4 && (
                            <div className="bg-white rounded-3xl shadow-2xl p-8">
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-bold text-gray-800 mb-2">
                                        {phase === 1 && 'المرحلة الأولى: اختيار 10 فائزين'}
                                        {phase === 2 && 'المرحلة الثانية: اختيار 5 فائزين'}
                                        {phase === 3 && 'المرحلة الثالثة: اختيار 3 فائزين'}
                                    </h2>
                                    <p className="text-xl text-gray-600">
                                        {phase === 1 && `من أصل ${maxNumber} مشارك`}
                                        {phase === 2 && 'من أصل 10 فائزين'}
                                        {phase === 3 && 'من أصل 5 فائزين'}
                                    </p>
                                </div>

                                <div className="min-h-64 flex flex-wrap justify-center items-center gap-4 mb-8 p-6 bg-gradient-to-br from-purple-100 to-pink-100 rounded-2xl">
                                    {isRolling ? (
                                        displayNumbers.slice(-10).map((num, idx) => (
                                            <div
                                                key={idx}
                                                className="w-20 h-20 bg-gradient-to-br from-purple-500 to-pink-500 text-white rounded-xl flex items-center justify-center text-3xl font-bold shadow-lg animate-bounce"
                                            >
                                                {num}
                                            </div>
                                        ))
                                    ) : displayNumbers.length > 0 ? (
                                        displayNumbers.map((num, idx) => (
                                            <div
                                                key={idx}
                                                className="w-24 h-24 bg-gradient-to-br from-green-500 to-emerald-600 text-white rounded-xl flex items-center justify-center text-3xl font-bold shadow-lg animate-pulse"
                                                style={{
                                                    animationDelay: `${idx * 0.1}s`
                                                }}
                                            >
                                                {num}
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-2xl text-gray-500">انتظر النتائج...</p>
                                    )}
                                </div>

                                {!isRolling && displayNumbers.length > 0 && (
                                    <button
                                        onClick={() => {
                                            if (phase === 1) startPhase2();
                                            else if (phase === 2) startPhase3();
                                            else if (phase === 3) startPhase4();
                                        }}
                                        className="block mx-auto bg-gradient-to-r from-green-500 to-emerald-600 text-white px-12 py-4 rounded-xl text-2xl font-bold hover:scale-105 transition-transform shadow-lg"
                                    >
                                        {phase === 1 && 'ابدأ المرحلة الثانية'}
                                        {phase === 2 && 'ابدأ المرحلة الثالثة'}
                                        {phase === 3 && 'ابدأ المرحلة النهائية'}
                                    </button>
                                )}
                            </div>
                        )}

                        {phase === 4 && (
                            <div className="bg-white rounded-3xl shadow-2xl p-8 text-center">
                                {isRolling ? (
                                    <div className="py-12">
                                        <h2 className="text-4xl font-bold text-gray-800 mb-8">
                                            جاري اختيار الفائز النهائي...
                                        </h2>
                                        <div className="flex justify-center">
                                            {displayNumbers.slice(-1).map((num, idx) => (
                                                <div
                                                    key={idx}
                                                    className="w-32 h-32 bg-gradient-to-br from-purple-500 to-pink-500 text-white rounded-2xl flex items-center justify-center text-5xl font-bold shadow-2xl animate-spin"
                                                >
                                                    {num}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : finalWinner && (
                                    <div className="py-8">
                                        <Gift className="w-32 h-32 mx-auto mb-6 text-yellow-500 animate-bounce" />
                                        <h2 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-6">
                                            مبروك! 🎉
                                        </h2>
                                        <div className="bg-gradient-to-br from-yellow-400 to-orange-500 w-40 h-40 mx-auto rounded-3xl flex items-center justify-center mb-6 shadow-2xl transform hover:scale-110 transition-transform">
                                            <span className="text-7xl font-bold text-white">
                                                {finalWinner}
                                            </span>
                                        </div>
                                        <h3 className="text-4xl font-bold text-gray-800 mb-8">
                                            الفائز بالجائزة الكبرى
                                        </h3>
                                        <button
                                            onClick={reset}
                                            className="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-6 rounded-full hover:scale-110 transition-transform shadow-lg flex items-center justify-center mx-auto"
                                            title="إعادة تعيين"
                                        >
                                            <RotateCcw className="w-10 h-10" />
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LotteryWheel />);
    </script>
</body>
</html>
